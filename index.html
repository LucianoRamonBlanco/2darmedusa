<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Medusa Neon AR</title>
  <style>
    body { margin: 0; font-family: -apple-system, system-ui, sans-serif; background: #000; overflow: hidden; color: #fff; }
    .ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
    .ui * { pointer-events: auto; }
    
    .topbar { position: absolute; top: env(safe-area-inset-top, 20px); left: 0; width: 100%; padding: 0 20px; box-sizing: border-box; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-weight: 800; font-size: 18px; letter-spacing: 1px; color: #00FFFF; text-shadow: 0 0 10px rgba(0,255,255,0.5); }
    
    .panel { position: absolute; top: 80px; right: 20px; width: 220px; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); border: 1px solid rgba(0,255,255,0.3); border-radius: 12px; padding: 15px; display: flex; flex-direction: column; gap: 12px; transition: transform 0.3s ease; }
    .panel.hidden { transform: translateX(260px); }
    
    .row { display: flex; flex-direction: column; gap: 4px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; opacity: 0.9; }
    input[type=range] { width: 100%; accent-color: #00FFFF; }
    
    .btn { background: rgba(0,255,255,0.1); border: 1px solid #00FFFF; color: #fff; padding: 10px; border-radius: 6px; text-align: center; cursor: pointer; font-size: 12px; }
    .btn:active { background: rgba(0,255,255,0.3); }

    .export-btn { position: absolute; bottom: env(safe-area-inset-bottom, 30px); right: 20px; width: 60px; height: 60px; border-radius: 50%; background: #00FFFF; border: none; font-weight: bold; color: #000; box-shadow: 0 0 20px rgba(0,255,255,0.4); }
    
    .prompt { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; background: rgba(0,0,0,0.6); padding: 20px; border-radius: 12px; opacity: 0; transition: opacity 0.5s; pointer-events: none; width: 80%; }
    .prompt.show { opacity: 1; }
    
    .status { position: absolute; bottom: env(safe-area-inset-bottom, 30px); left: 20px; font-size: 12px; opacity: 0.6; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div class="ui">
    <div class="topbar">
      <span class="logo">MEDUSA NEON φ</span>
      <button onclick="togglePanel()" style="width:40px;height:40px;border:1px solid #00FFFF;border-radius:8px;background:rgba(0,255,255,0.06);color:#fff;font-size:18px;">☰</button>
    </div>

    <div class="panel" id="panel">
      <div class="row">
        <span>Tentáculos: <span id="tentaclesVal">6</span></span>
        <input type="range" id="tentacles" min="4" max="10" value="6">
      </div>
      <div class="row">
        <span>Velocidad: <span id="speedVal">1.0</span></span>
        <input type="range" id="speed" min="0.2" max="2.5" step="0.1" value="1.0">
      </div>
      <div class="row">
        <span>Brillo: <span id="glowVal">1.6</span></span>
        <input type="range" id="glow" min="0.5" max="3" step="0.1" value="1.6">
      </div>
      <div class="btn" onclick="travelToNextWall()">Siguiente Pared</div>
      <div class="btn" onclick="resetAR()">Resetear AR</div>
    </div>

    <button class="export-btn" id="exportPngBtn">PNG</button>
    <div class="prompt" id="prompt">Mueve el teléfono buscando una pared...</div>
    <div class="status" id="status">Esperando AR...</div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { ARButton } from 'three/addons/webxr/ARButton.js';

    const state = { tentacles: 6, speed: 1.0, glow: 1.6, placed: false };
    let scene, camera, renderer, controller, reticle, hitTestSource = null, hitTestSourceRequested = false;
    let medusaPlane = null, placedPlanes = [], lastWorkerUpdate = 0, pendingBitmap = null;

    // === WORKER INLINE ===
    const workerCode = `
      let offCanvas, ctx;
      self.onmessage = function(e) {
        const { tentacles, speed, glow, time, width, height } = e.data;
        if (!offCanvas) { offCanvas = new OffscreenCanvas(width, height); ctx = offCanvas.getContext('2d'); }
        ctx.clearRect(0, 0, width, height);
        const cx = width/2, cy = height*0.48;
        for (let i = 0; i < tentacles; i++) {
          const angle = (i/tentacles) * Math.PI*2 + (time*0.4*speed);
          const hue = (time*30 + i*42)%360;
          ctx.strokeStyle = 'hsla('+hue+', 100%, 72%, 0.9)';
          ctx.shadowColor = 'hsla('+hue+', 100%, 65%, 1)';
          ctx.shadowBlur = 18 * glow;
          ctx.lineWidth = 4;
          ctx.beginPath(); ctx.moveTo(cx, cy);
          for(let p=1; p<=5; p++) {
            const tx = cx + Math.cos(angle)*(115+Math.sin(time+i)*15)*(p/5);
            const ty = cy + Math.sin(angle)*80*(p/5) + Math.sin(time*1.8+p)*15;
            ctx.lineTo(tx, ty);
          }
          ctx.stroke();
        }
        const bitmap = offCanvas.transferToImageBitmap();
        self.postMessage({ bitmap }, [bitmap]);
      };
    `;
    const workerURL = URL.createObjectURL(new Blob([workerCode], { type: 'application/javascript' }));
    const worker = new Worker(workerURL);
    worker.onmessage = (e) => { if(pendingBitmap) pendingBitmap.close(); pendingBitmap = e.data.bitmap; };

    function init() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.01, 20);
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      document.body.appendChild(renderer.domElement);

      document.body.appendChild(ARButton.createButton(renderer, { 
        requiredFeatures: ['hit-test'], 
        optionalFeatures: ['dom-overlay'], 
        domOverlay: { root: document.querySelector('.ui') } 
      }));

      reticle = new THREE.Mesh(new THREE.RingGeometry(0.1, 0.12, 32), new THREE.MeshBasicMaterial({ color: 0x00FFFF }));
      reticle.matrixAutoUpdate = false;
      reticle.visible = false;
      scene.add(reticle);

      controller = renderer.xr.getController(0);
      controller.addEventListener('select', () => {
        if (reticle.visible) {
          const tex = new THREE.Texture();
          const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, blending: THREE.AdditiveBlending, side: THREE.DoubleSide });
          const mesh = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), mat);
          mesh.matrix.copy(reticle.matrix);
          mesh.matrixAutoUpdate = false;
          scene.add(mesh);
          medusaPlane = mesh;
          placedPlanes.push({ mesh, matrix: reticle.matrix.clone() });
          state.placed = true;
          document.getElementById('prompt').classList.remove('show');
        }
      });
      scene.add(controller);

      renderer.setAnimationLoop(render);
    }

    function render(timestamp, frame) {
      if (frame) {
        const session = renderer.xr.getSession();
        if (!hitTestSourceRequested) {
          session.requestReferenceSpace('viewer').then(space => {
            session.requestHitTestSource({ space }).then(src => hitTestSource = src);
          });
          hitTestSourceRequested = true;
        }
        if (hitTestSource && !state.placed) {
          const hits = frame.getHitTestResults(hitTestSource);
          if (hits.length) {
            reticle.visible = true;
            reticle.matrix.fromArray(hits[0].getPose(renderer.xr.getReferenceSpace()).transform.matrix);
          } else { reticle.visible = false; }
        }
      }

      const now = performance.now();
      if (medusaPlane && now - lastWorkerUpdate > 50) {
        lastWorkerUpdate = now;
        worker.postMessage({ ...state, time: now/1000, width: 512, height: 512 });
      }

      if (pendingBitmap && medusaPlane) {
        medusaPlane.material.map.image = pendingBitmap;
        medusaPlane.material.map.needsUpdate = true;
      }
      renderer.render(scene, camera);
    }

    // Funciones de UI globales
    window.togglePanel = () => document.getElementById('panel').classList.toggle('hidden');
    window.resetAR = () => { location.reload(); };
    window.travelToNextWall = () => { /* Lógica de viaje simple */ };
    
    document.getElementById('tentacles').oninput = (e) => { state.tentacles = e.target.value; document.getElementById('tentaclesVal').innerText = e.target.value; };
    document.getElementById('speed').oninput = (e) => { state.speed = e.target.value; document.getElementById('speedVal').innerText = e.target.value; };
    document.getElementById('glow').oninput = (e) => { state.glow = e.target.value; document.getElementById('glowVal').innerText = e.target.value; };

    init();
    setTimeout(() => document.getElementById('prompt').classList.add('show'), 2000);
  </script>
</body>
</html>
